<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening page…</title>
    <script>
      var segmentCount = 0;
      var location = window.location;
      var route = location.pathname.split("/").slice(0, 1 + segmentCount).join("/");
      var destination = route + "/?/" + location.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") + (location.search ? "&" + location.search.slice(1).replace(/&/g, "~and~") : "") + location.hash;
      location.replace(destination);
    </script>
  </head>
  <body>
    <noscript>This portfolio needs JavaScript to open the requested page.</noscript>
  </body>
</html>
